<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark">
      <div
        class="container-fluid d-flex justify-content-center align-items-center gap-4"
      >
        <a href="#" class="navbar-brand mb-0">Expense Tracker</a>
        <span id="datetime-text" class="text-white fw-bold"></span>

        <button onclick="exportCSV()" class="btn btn-success">Download expenses</button>
      </div> 
      <!-- CSV: Comma-Separated Values -->
    </nav>

    <main class="container-md py-3">
      <div id="alertContainer"></div>

      <div id="loadingSpinner" class="text-center my-3 d-none">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>

      <section class="row row-cols-sm-1 row-cols-md-3 g-4 m-2">
        <div class="col">
          <div class="card h-100 shadow-sm">
            <div class="card-body text-center">
              <p class="card-title text-muted mb-1">Total</p>
              <h4 class="card-text" id="totalExpenses">0.00</h4>
            </div>
          </div>
        </div>
        <div class="col">
          <div class="card h-100 text-center shadow-sm">
            <div class="card-body">
              <p class="card-title text-muted mb-1">Number of expenses</p>
              <h4 class="card-text" id="expenseCount">0</h4>
            </div>
          </div>
        </div>
        <div class="col">
          <div class="card h-100 text-center shadow-sm">
            <div class="card-body">
              <p class="card-title text-muted mb-1">Highest expense</p>
              <h4 class="card-text" id="highestExpense">0.00</h4>
            </div>
          </div>
        </div>
      </section>

      <section class="col m-3">
        <div class="card h-100 p-4 shadow-sm">
          <h4 class="mb-3">Add expense</h4>
          <form id="addExpenseForm" class="row g-3">
            <div class="col-md-4">
              <label for="inputTitle" class="form-label">Title</label>
              <input
                type="text"
                class="form-control"
                id="inputTitle"
                maxlength="100"
              />
              <div class="invalid-feedback">Title is required.</div>
            </div>
            <div class="col-md-2">
              <label for="inputAmount" class="form-label">Amount</label>
              <input
                type="number"
                class="form-control"
                id="inputAmount"
                min="0.01"
                step="0.01"
              />
              <div class="invalid-feedback">
                Amount must be a number greater than 0.
              </div>
            </div>
            <div class="col-md-3">
              <label for="inputCategory" class="form-label">Category</label>
              <select id="inputCategory" class="form-select">
                <option value="" selected>Choose...</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
              <div class="invalid-feedback">Please choose a category.</div>
            </div>
            <div class="col-md-3">
              <label for="inputDate" class="form-label">Date</label>
              <input type="date" class="form-control" id="inputDate" />
              <div class="invalid-feedback">Please choose a valid date.</div>
            </div>
            <div class="col-12">
              <button type="submit" class="btn btn-primary">Add expense</button>
            </div>
          </form>
        </div>
      </section>

      <section class="col m-3">
        <div class="card shadow-sm">
          <div class="card-body">
            <div
              class="d-flex flex-column flex-md-row flex-wrap justify-content-between align-items-md-center gap-3 px-2 mb-3"
            >
              <h5 class="mb-0 me-2">Expenses</h5>

              <div class="input-group w-auto">
                <span class="input-group-text">Search by title</span>
                <input
                  type="text"
                  id="titleSearch"
                  class="form-control"
                  placeholder="Search expenses..."
                />
              </div>

              <div class="d-flex align-items-center gap-2">
                <label for="categoryFilter" class="form-label">
                  Filter by category
                </label>

                <select id="categoryFilter" class="form-select w-auto">
                  <option value="All" selected>All</option>
                  <option value="Food">Food</option>
                  <option value="Transport">Transport</option>
                  <option value="Bills">Bills</option>
                  <option value="Entertainment">Entertainment</option>
                  <option value="Other">Other</option>
                </select>
              </div>
            </div>
            <div class="table-responsive">
              <table class="table table-striped table-hover">
                <thead class="table-dark">
                  <tr>
                    <th>Title</th>
                    <th>Amount</th>
                    <th>Category</th>
                    <th>Date</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="expensesTableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div class="modal" id="editExpenseModal" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="editExpenseForm">
            <div class="modal-header">
              <h5 class="modal-title">Edit expense</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="editId" />
              <div class="mb-3">
                <label for="editTitle" class="form-label">Title</label>
                <input
                  type="text"
                  class="form-control"
                  id="editTitle"
                  maxlength="100"
                  max="100"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="editAmount" class="form-label">Amount</label>
                <input
                  type="number"
                  class="form-control"
                  id="editAmount"
                  min="0.01"
                  step="0.01"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="editCategory" class="form-label">Category</label>
                <select id="editCategory" class="form-select" required>
                  <option value="Food">Food</option>
                  <option value="Transport">Transport</option>
                  <option value="Bills">Bills</option>
                  <option value="Entertainment">Entertainment</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="editDate" class="form-label">Date</label>
                <input
                  type="date"
                  class="form-control"
                  id="editDate"
                  required
                />
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>
              <button type="submit" class="btn btn-primary">
                Save changes
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
